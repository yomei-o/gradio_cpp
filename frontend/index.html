<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradio</title>
<style>
:root {
  --bg: #ffffff; --block: #ffffff; --panel: #f9fafb; --border: #e5e7eb; --text: #1f2937; --muted: #6b7280;
  --input: #ffffff; --primary: #f97316; --primary-hover: #ea580c; --primary-text: #ffffff;
  --secondary: #f3f4f6; --secondary-hover: #e5e7eb; --error: #dc2626; --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f19; --block: #1f2937; --panel: #111827; --border: #374151; --text: #f3f4f6; --muted: #9ca3af;
    --input: #111827; --secondary: #374151; --secondary-hover: #4b5563;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f19; --block: #1f2937; --panel: #111827; --border: #374151; --text: #f3f4f6; --muted: #9ca3af;
  --input: #111827; --secondary: #374151; --secondary-hover: #4b5563;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 "Source Sans Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
#app { max-width: 1280px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
.row > * { flex: 1 1 0; min-width: min(320px, 100%); }
.row > .btn { min-width: 120px; }
.column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.block { position: relative; background: var(--block); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.block.plain { background: none; border: none; padding: 0; }
.label { font-size: 13px; color: var(--muted); font-weight: 600; }
.info { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], textarea { width: 100%; font: inherit; color: var(--text); background: var(--input);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; outline: none; }
textarea { resize: vertical; }
input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }
input[readonly], textarea[readonly] { background: var(--panel); }
.slider-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slider-head input { width: 90px; padding: 3px 6px; }
input[type=range] { width: 100%; accent-color: var(--primary); }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.btn { font: inherit; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 16px;
  cursor: pointer; background: var(--secondary); color: var(--text); }
.btn:hover { background: var(--secondary-hover); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.btn.primary:hover { background: var(--primary-hover); }
.drop { border: 2px dashed var(--border); border-radius: 6px; min-height: 220px; display: flex; align-items: center;
  justify-content: center; text-align: center; color: var(--muted); cursor: pointer; overflow: hidden; position: relative; padding: 8px; }
.drop.over { border-color: var(--primary); }
.drop img { max-width: 100%; max-height: 420px; display: block; }
.drop.static { cursor: default; border-style: solid; }
.x { position: absolute; top: 6px; right: 6px; border: none; border-radius: 4px; background: var(--secondary); color: var(--text);
  cursor: pointer; padding: 2px 8px; font-size: 14px; }
.filelink { color: var(--primary); word-break: break-all; }
.md h1 { margin: 0.2em 0; font-size: 1.8em; } .md h2 { font-size: 1.4em; margin: 0.4em 0; } .md p { margin: 0.4em 0; }
.md.title h1 { text-align: center; }
.md code { background: var(--secondary); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--panel); padding: 10px; border-radius: 6px; overflow: auto; }
.md a { color: var(--primary); }
pre.json { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.pending::after { content: ""; position: absolute; inset: -1px; border: 2px solid var(--primary); border-radius: var(--radius);
  animation: pulse 1.2s ease-in-out infinite; pointer-events: none; }
.timer { position: absolute; top: 8px; right: 12px; font-size: 12px; color: var(--muted); }
@keyframes pulse { 50% { opacity: 0.25; } }
#toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-width: calc(100vw - 32px); }
.toast { background: var(--block); border: 1px solid var(--error); border-left-width: 5px; border-radius: 6px; padding: 10px 14px;
  min-width: 240px; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.15); white-space: pre-wrap; word-break: break-word; }
.toast b { color: var(--error); display: block; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 16px; }
footer a { color: var(--muted); cursor: pointer; }
#api { display: none; }
#api.open { display: block; }
#api pre { background: var(--panel); border: 1px solid var(--border); padding: 10px; border-radius: 6px; overflow: auto; font-size: 13px; }
.hidden { display: none !important; }
.btn.stop { background: color-mix(in srgb, var(--error) 12%, var(--block)); border-color: var(--error); color: var(--error); }
.chat { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; word-break: break-word; }
.msg.user { align-self: flex-end; background: color-mix(in srgb, var(--primary) 14%, var(--block)); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); }
.msg.assistant, .msg.system { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
.msg.user .md { white-space: pre-wrap; }
.msg img { max-width: min(360px, 100%); max-height: 360px; border-radius: 6px; display: block; }
.msg .md > :first-child { margin-top: 0; } .msg .md > :last-child { margin-bottom: 0; }
.msg .meta { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.typing::after { content: "\2026"; animation: pulse 1s infinite; }
.mm { display: flex; flex-direction: column; gap: 6px; }
.mm .files { display: flex; flex-wrap: wrap; gap: 6px; }
.mm .thumb { position: relative; width: 64px; height: 64px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); text-align: center; }
.mm .thumb img { width: 100%; height: 100%; object-fit: cover; }
.mm .thumb button { position: absolute; top: 1px; right: 1px; border: none; border-radius: 4px; padding: 0 5px; cursor: pointer;
  background: rgba(0,0,0,.55); color: #fff; font-size: 12px; }
.mm .bar { display: flex; gap: 6px; align-items: flex-end; }
.mm textarea { flex: 1; resize: none; max-height: 240px; }
.mm .icon { border: 1px solid var(--border); background: var(--secondary); color: var(--text); border-radius: 6px; width: 38px; height: 38px;
  cursor: pointer; font-size: 18px; flex: none; }
.mm .send { background: var(--primary); border-color: var(--primary); color: #fff; }
.mm.over { outline: 2px dashed var(--primary); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<footer><a id="apilink">Use via API</a> · Built with gradio_cpp</footer>
<div id="api"></div>
<script>
"use strict";
const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
const comps = {};    // id -> {get, set, reset, on, loading}
let CFG = null;

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

// Small Markdown renderer: headings, paragraphs, lists, code, bold, italic, links.
function markdown(src) {
  const inline = s => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let para = [], list = null, code = null;
  const flush = () => { if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>"); para = [];
    if (list) { out.push("<ul>" + list.map(i => "<li>" + inline(i) + "</li>").join("") + "</ul>"); list = null; } };
  for (const line of String(src ?? "").split("\n")) {
    if (code !== null) { if (line.startsWith("```")) { out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>"); code = null; } else code.push(line); continue; }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = line.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)$/);
    if (li) { if (para.length) { const l = list; list = null; flush(); list = l; } (list ??= []).push(li[1]); continue; }
    if (!line.trim()) { flush(); continue; }
    if (list) flush();
    para.push(line.trim());
  }
  if (code !== null) out.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
  flush();
  return out.join("");
}

function toast(title, msg) {
  const t = el("div", "toast", document.getElementById("toasts"));
  el("b", "", t).textContent = title;
  t.appendChild(document.createTextNode(msg));
  setTimeout(() => t.remove(), 8000);
  t.onclick = () => t.remove();
}

function emitter() {
  const h = {};
  return { on: (ev, f) => (h[ev] ??= []).push(f), fire: ev => (h[ev] || []).forEach(f => f()) };
}

function block(c, parent) {
  const b = el("div", "block", parent);
  if (c.props.elem_id) b.id = c.props.elem_id;
  if (c.props.visible === false) b.classList.add("hidden");
  if (c.props.show_label !== false && c.props.label) el("span", "label", b).textContent = c.props.label;
  if (c.props.info) el("span", "info", b).textContent = c.props.info;
  return b;
}

function withLoading(b) {
  // Counted, so overlapping runs that share an output don't cancel each other's indicator.
  let n = 0, timer = null, t0 = 0, span = null;
  return on => {
    if (on) {
      if (n++ > 0) return;
      b.classList.add("pending"); t0 = performance.now(); span = el("span", "timer", b);
      const s = span;
      timer = setInterval(() => s.textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s", 100);
    } else {
      if (n === 0 || --n > 0) return;
      b.classList.remove("pending"); clearInterval(timer); span?.remove(); span = null;
    }
  };
}

async function upload(file) {
  const fd = new FormData(); fd.append("files", file);
  const r = await fetch("gradio_api/upload", { method: "POST", body: fd });
  if (!r.ok) throw new Error("upload failed: " + r.status);
  const [path] = await r.json();
  return { path, orig_name: file.name, mime_type: file.type || null, size: file.size, meta: { _type: "gradio.FileData" } };
}

const RENDER = {
  textbox(c, parent) {
    const b = block(c, parent), ev = emitter(), p = c.props;
    const multi = (p.lines || 1) > 1 || (!p.interactive && (p.max_lines || 1) > 1);
    const inp = el(multi ? "textarea" : "input", "", b);
    if (multi) inp.rows = p.lines || 1; else inp.type = "text";
    inp.placeholder = p.placeholder || "";
    inp.readOnly = !p.interactive;
    const set = v => { inp.value = v ?? ""; if (multi && !p.interactive) autoGrow(); };
    const autoGrow = () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight + 2, 600) + "px"; };
    inp.addEventListener("input", () => { ev.fire("input"); ev.fire("change"); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && (!multi || (p.lines || 1) === 1) && !e.shiftKey) { e.preventDefault(); ev.fire("submit"); } });
    set(p.value);
    return { get: () => inp.value, set, reset: () => set(p.value), on: ev.on, loading: withLoading(b) };
  },
  number(c, parent) {
    const b = block(c, parent), ev = emitter(), p = c.props;
    const inp = el("input", "", b); inp.type = "number"; inp.step = p.step ?? "any"; inp.readOnly = !p.interactive;
    if (p.minimum != null) inp.min = p.minimum; if (p.maximum != null) inp.max = p.maximum;
    const set = v => inp.value = v ?? "";
    inp.addEventListener("input", () => { ev.fire("input"); ev.fire("change"); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") ev.fire("submit"); });
    set(p.value);
    return { get: () => inp.value === "" ? null : Number(inp.value), set, reset: () => set(p.value), on: ev.on, loading: withLoading(b) };
  },
  slider(c, parent) {
    const p = c.props, b = el("div", "block", parent), ev = emitter();
    if (p.visible === false) b.classList.add("hidden");
    const head = el("div", "slider-head", b);
    el("span", "label", head).textContent = p.label || "";
    const num = el("input", "", head); num.type = "number";
    const rng = el("input", "", b); rng.type = "range";
    for (const e of [num, rng]) { e.min = p.minimum; e.max = p.maximum; e.step = p.step ?? 1; e.disabled = !p.interactive; }
    if (p.info) el("span", "info", b).textContent = p.info;
    const set = v => { num.value = v; rng.value = v; };
    rng.addEventListener("input", () => { num.value = rng.value; ev.fire("input"); ev.fire("change"); });
    rng.addEventListener("change", () => ev.fire("release"));
    num.addEventListener("change", () => { rng.value = num.value; ev.fire("change"); ev.fire("release"); });
    set(p.value);
    return { get: () => Number(num.value), set, reset: () => set(p.value), on: ev.on, loading: withLoading(b) };
  },
  checkbox(c, parent) {
    const p = c.props, b = el("div", "block", parent), ev = emitter();
    if (p.visible === false) b.classList.add("hidden");
    if (p.info) el("span", "info", b).textContent = p.info;
    const lab = el("label", "check", b), box = el("input", "", lab); box.type = "checkbox"; box.disabled = !p.interactive;
    el("span", "", lab).textContent = p.label || "";
    const set = v => box.checked = !!v;
    box.addEventListener("change", () => { ev.fire("input"); ev.fire("change"); });
    set(p.value);
    return { get: () => box.checked, set, reset: () => set(p.value), on: ev.on, loading: withLoading(b) };
  },
  image(c, parent) { return fileLike(c, parent, true); },
  file(c, parent) { return fileLike(c, parent, false); },
  markdown(c, parent) {
    const p = c.props, b = el("div", "block plain", parent), d = el("div", "md", b);
    if (p.elem_classes) d.classList.add(...[].concat(p.elem_classes));
    if (p.visible === false) b.classList.add("hidden");
    const set = v => d.innerHTML = markdown(v);
    set(p.value);
    return { get: () => p.value, set: v => { p.value = v; set(v); }, reset: () => {}, on: emitter().on, loading: withLoading(b) };
  },
  json(c, parent) {
    const b = block(c, parent), pre = el("pre", "json", b);
    const set = v => pre.textContent = v == null ? "" : JSON.stringify(v, null, 2);
    let val = c.props.value; set(val);
    return { get: () => val, set: v => { val = v; set(v); }, reset: () => { val = c.props.value; set(val); }, on: emitter().on, loading: withLoading(b) };
  },
  chatbot(c, parent) {
    const p = c.props, b = block(c, parent), box = el("div", "chat", b);
    box.style.height = (p.height || 480) + "px";
    let val = [];
    const set = v => {
      val = Array.isArray(v) ? v : [];
      const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.innerHTML = "";
      for (const m of val) {
        const d = el("div", "msg " + (m.role || "assistant"), box);
        if (m.metadata && m.metadata.title) el("div", "meta", d).textContent = m.metadata.title;
        const ct = m.content;
        if (ct && typeof ct === "object") {
          const f = ct.file || ct;
          if ((f.mime_type || "").startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.path || "")) {
            const img = el("img", "", d); img.src = f.url; img.alt = ct.alt_text || f.orig_name || "";
          } else { const a = el("a", "filelink", d); a.href = f.url; a.download = f.orig_name || ""; a.textContent = f.orig_name || "file"; }
        } else {
          const md = el("div", "md", d);
          if (m.role === "user") md.textContent = ct ?? "";
          else if (!ct) md.className = "md typing";
          else md.innerHTML = markdown(ct);
        }
      }
      if (stick) box.scrollTop = box.scrollHeight;
    };
    set(p.value);
    return { get: () => val, set, reset: () => set(p.value), on: emitter().on, loading: withLoading(b) };
  },
  multimodaltextbox(c, parent) {
    const p = c.props, b = block(c, parent), ev = emitter(), wrap = el("div", "mm", b);
    const filesRow = el("div", "files", wrap), bar = el("div", "bar", wrap);
    const picker = el("input", "", wrap); picker.type = "file"; picker.hidden = true; picker.multiple = true;
    if (p.file_types) picker.accept = p.file_types;
    const attach = el("button", "icon", bar); attach.type = "button"; attach.textContent = "+"; attach.title = "Attach files";
    const ta = el("textarea", "", bar); ta.rows = 1; ta.placeholder = p.placeholder || "";
    const send = el("button", "icon send", bar); send.type = "button"; send.textContent = "↑"; send.title = "Send";
    let files = [];  // {value, pending, url, name, isImage}
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, 240) + "px"; };
    const draw = () => {
      filesRow.innerHTML = "";
      files.forEach((f, i) => {
        const t = el("div", "thumb", filesRow);
        if (f.isImage) { const im = el("img", "", t); im.src = f.url; } else t.textContent = f.name;
        const x = el("button", "", t); x.textContent = "×"; x.onclick = () => { files.splice(i, 1); draw(); };
      });
    };
    const add = list => {
      for (const file of list) {
        const f = { name: file.name, url: URL.createObjectURL(file), isImage: file.type.startsWith("image/"), value: null };
        f.pending = upload(file).then(v => (f.value = v))
          .catch(e => { toast("Error", e.message); files = files.filter(x => x !== f); draw(); return null; });
        files.push(f);
      }
      draw();
    };
    const set = v => {
      ta.value = (v && v.text) || ""; grow();
      files = ((v && v.files) || []).filter(Boolean).map(fd => ({ name: fd.orig_name, url: fd.url, value: fd,
        isImage: (fd.mime_type || "").startsWith("image/"), pending: null }));
      draw();
    };
    const get = async () => {
      const vals = await Promise.all(files.map(f => f.pending || f.value));
      return { text: ta.value, files: vals.filter(Boolean) };
    };
    attach.onclick = () => picker.click();
    picker.onchange = () => { add(picker.files); picker.value = ""; };
    send.onclick = () => ev.fire("submit");
    ta.addEventListener("input", () => { grow(); ev.fire("change"); });
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ev.fire("submit"); } });
    ta.addEventListener("paste", e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); add(fs); } });
    wrap.ondragover = e => { e.preventDefault(); wrap.classList.add("over"); };
    wrap.ondragleave = () => wrap.classList.remove("over");
    wrap.ondrop = e => { e.preventDefault(); wrap.classList.remove("over"); add(e.dataTransfer.files); };
    set(p.value);
    return { get, set, reset: () => set(p.value), on: ev.on, loading: () => {} };
  },
  button(c, parent) {
    const p = c.props, btn = el("button", "btn " + (p.variant || "secondary"), parent), ev = emitter();
    btn.textContent = p.value; if (p.visible === false) btn.classList.add("hidden");
    btn.addEventListener("click", () => ev.fire("click"));
    return { el: btn, get: () => p.value, set: v => btn.textContent = v, reset: () => {}, on: ev.on, loading: () => {} };
  },
  clearbutton(c, parent) {
    const p = c.props, btn = el("button", "btn " + (p.variant || "secondary"), parent), ev = emitter();
    btn.textContent = p.value;
    btn.addEventListener("click", () => { for (const id of p.components || []) comps[id]?.reset(); ev.fire("click"); });
    return { get: () => p.value, set: v => btn.textContent = v, reset: () => {}, on: ev.on, loading: () => {} };
  },
};

function fileLike(c, parent, isImage) {
  const p = c.props, b = block(c, parent), ev = emitter();
  const drop = el("div", "drop" + (p.interactive ? "" : " static"), b);
  let value = null, pending = null;
  const picker = el("input", "", b); picker.type = "file"; picker.hidden = true;
  if (isImage) picker.accept = "image/*";
  const show = (v, localUrl) => {
    drop.innerHTML = "";
    if (!v) { drop.textContent = p.interactive ? (isImage ? "Drop Image Here\n- or -\nClick to Upload" : "Drop File Here\n- or -\nClick to Upload") : "";
      drop.style.whiteSpace = "pre-line"; return; }
    if (isImage) { const img = el("img", "", drop); img.src = localUrl || v.url; img.alt = v.orig_name || ""; }
    else { const a = el("a", "filelink", drop); a.href = localUrl || v.url; a.download = v.orig_name || "";
      a.textContent = (v.orig_name || "file") + (v.size != null ? `  (${(v.size / 1024).toFixed(1)} KB)` : ""); a.onclick = e => e.stopPropagation(); }
    if (p.interactive) { const x = el("button", "x", drop); x.textContent = "×"; x.title = "Clear";
      x.onclick = e => { e.stopPropagation(); set(null); ev.fire("change"); }; }
  };
  const set = v => { value = v; pending = null; show(v); };
  const take = file => {
    if (!file) return;
    show({ orig_name: file.name, size: file.size }, URL.createObjectURL(file));
    pending = upload(file).then(v => { value = v; pending = null; ev.fire("upload"); ev.fire("change"); return v; })
      .catch(e => { toast("Error", e.message); set(null); return null; });
  };
  if (p.interactive) {
    drop.onclick = () => picker.click();
    picker.onchange = () => { take(picker.files[0]); picker.value = ""; };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); };
  }
  set(p.value);
  return { get: () => pending || value, set, reset: () => set(p.value), on: ev.on, loading: withLoading(b) };
}

function build(node, parent, byId) {
  for (const ch of node.children || []) {
    const c = byId[ch.id];
    if (c.type === "row" || c.type === "column") {
      const d = el("div", c.type, parent);
      if (c.props.visible === false) d.classList.add("hidden");
      build(ch, d, byId);
      continue;
    }
    const r = RENDER[c.type];
    if (!r) { const b = el("div", "block", parent); b.textContent = `[unsupported component: ${c.type}]`; continue; }
    comps[c.id] = r(c, parent);
  }
}

// Read a Server-Sent Events stream, calling cb(event, data) per message.
async function readSSE(resp, cb) {
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (value) buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const msg = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = "message", data = [];
      for (const line of msg.split("\n")) {
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      cb(ev, data.join("\n"));
    }
    if (done) return;
  }
}

const running = {};  // dep id -> Set of AbortControllers

// Buttons with `cancels` (e.g. Stop) are shown only while their events run.
function updateCancelButtons() {
  for (const c of CFG.components) {
    const cancels = c.props.cancels;
    if (!cancels || !comps[c.id]?.el) continue;
    const busy = cancels.some(id => running[id]?.size);
    comps[c.id].el.classList.toggle("hidden", !busy && c.props.visible === false);
  }
}

async function run(dep) {
  if (!dep.backend_fn) {
    for (const id of dep.cancels || []) for (const ac of running[id] || []) ac.abort();
    return;
  }
  const outs = dep.outputs.map(id => comps[id]).filter(Boolean);
  const ac = new AbortController();
  (running[dep.id] ??= new Set()).add(ac);
  updateCancelButtons();
  outs.forEach(c => c.loading(true));
  let ok = false;
  try {
    const data = await Promise.all(dep.inputs.map(id => comps[id].get()));
    const r = await fetch(`gradio_api/call/${encodeURIComponent(dep.api_name)}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ data }), signal: ac.signal });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
    const { event_id } = await r.json();
    const s = await fetch(`gradio_api/call/${encodeURIComponent(dep.api_name)}/${event_id}`, { signal: ac.signal });
    if (!s.ok) throw new Error(`HTTP ${s.status}`);
    let error = null;
    await readSSE(s, (ev, d) => {
      if (ev === "generating" || ev === "complete") {
        const vals = JSON.parse(d);
        dep.outputs.forEach((id, i) => { if (i < vals.length) comps[id]?.set(vals[i]); });
      } else if (ev === "error") error = JSON.parse(d) ?? "error";
    });
    if (error) throw new Error(error);
    ok = true;
  } catch (e) {
    if (e.name !== "AbortError") toast("Error", e.message);
  } finally {
    running[dep.id].delete(ac);
    updateCancelButtons();
    outs.forEach(c => c.loading(false));
  }
  for (const next of CFG.dependencies)
    if (next.trigger_after === dep.id && (ok || !next.trigger_only_on_success)) run(next);
}

function apiDocs() {
  const box = document.getElementById("api");
  if (box.dataset.ready) { box.classList.toggle("open"); return; }
  box.className = "open"; box.dataset.ready = "1";
  const wrap = el("div", "", box); wrap.style.cssText = "max-width:1280px;margin:0 auto;padding:0 16px 24px";
  fetch("gradio_api/info").then(r => r.json()).then(info => {
    const base = location.origin + location.pathname.replace(/\/$/, "");
    el("h2", "", wrap).textContent = "API";
    for (const [name, ep] of Object.entries(info.named_endpoints)) {
      el("h3", "", wrap).textContent = name;
      const ex = JSON.stringify({ data: ep.parameters.map(p => p.example_input) });
      el("pre", "", wrap).textContent =
        `curl -X POST ${base}/gradio_api/call${name} -s -H "Content-Type: application/json" -d '${ex}' \\\n` +
        `  | awk -F'"' '{ print $4}' \\\n` +
        `  | read EVENT_ID; curl -N ${base}/gradio_api/call${name}/$EVENT_ID`;
      const ul = el("ul", "", wrap);
      ep.parameters.forEach((p, i) => el("li", "", ul).textContent = `[${i}] ${p.label ?? ""} : ${p.python_type.type} (${p.component})`);
      el("p", "info", wrap).textContent = "Returns: " + ep.returns.map(r => `${r.label ?? ""} : ${r.python_type.type}`).join(", ");
    }
    box.scrollIntoView({ behavior: "smooth" });
  });
}

async function main() {
  CFG = await (await fetch("config")).json();
  document.title = CFG.title || "Gradio";
  const byId = Object.fromEntries(CFG.components.map(c => [c.id, c]));
  build(CFG.layout, document.getElementById("app"), byId);
  for (const dep of CFG.dependencies)
    for (const [id, ev] of dep.targets) comps[id]?.on(ev, () => run(dep));
  document.getElementById("apilink").onclick = apiDocs;
}
main().catch(e => toast("Error", "failed to load: " + e.message));
</script>
